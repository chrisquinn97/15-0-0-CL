<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15-0-0-CL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap');
  :root{--bg:#080d1a;--surface:#0e1628;--card:#131d35;--border:#1e2e52;--accent:#2563eb;--accent2:#3b82f6;--gold:#f59e0b;--text:#e8edf8;--muted:#6b7fa8;--pd:#1a3d2b;--pl:#1e4730;--pline:rgba(255,255,255,0.25);--red:#ef4444;--green:#22c55e;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1px 1px at 20% 15%,rgba(255,255,255,.4) 0%,transparent 100%),radial-gradient(1px 1px at 80% 25%,rgba(255,255,255,.3) 0%,transparent 100%),radial-gradient(1px 1px at 45% 60%,rgba(255,255,255,.25) 0%,transparent 100%),radial-gradient(1px 1px at 70% 80%,rgba(255,255,255,.3) 0%,transparent 100%),radial-gradient(2px 2px at 15% 50%,rgba(255,255,255,.15) 0%,transparent 100%),radial-gradient(2px 2px at 75% 55%,rgba(255,255,255,.1) 0%,transparent 100%);}
  .app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 0 60px;}
  .hdr{text-align:center;padding:22px 20px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(37,99,235,.08) 0%,transparent 100%);}
  .hdr-stars{font-size:10px;letter-spacing:6px;color:var(--gold);margin-bottom:5px;}
  .hdr h1{font-family:"Bebas Neue",cursive;font-size:34px;letter-spacing:3px;background:linear-gradient(135deg,#fff 0%,#93c5fd 50%,#2563eb 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .hdr-sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
  .hdr-ctrl{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;}
  .tog-wrap{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;}
  .tog{position:relative;width:36px;height:19px;cursor:pointer;}
  .tog input{opacity:0;width:0;height:0;}
  .tog-sl{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:background .2s;}
  .tog-sl::before{content:"";position:absolute;width:13px;height:13px;left:3px;top:3px;background:white;border-radius:50%;transition:transform .2s;}
  .tog input:checked+.tog-sl{background:var(--accent);}
  .tog input:checked+.tog-sl::before{transform:translateX(17px);}
  .roll-wrap{margin:12px 14px 0;}
  .btn-roll{width:100%;padding:16px;background:linear-gradient(135deg,#1d4ed8,#2563eb);border:none;border-radius:10px;color:white;font-family:"Bebas Neue",cursive;font-size:21px;letter-spacing:3px;cursor:pointer;transition:all .2s;box-shadow:0 4px 18px rgba(37,99,235,.4);display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-roll:hover:not(:disabled){transform:translateY(-1px);}
  .btn-roll:disabled{background:#1e2e52;box-shadow:none;cursor:not-allowed;opacity:.5;}
  .sm-wrap{margin:10px 14px 0;}
  .sm{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative;}
  .sm::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold));}
  .sm-reels{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);}
  .sm-reel{background:var(--card);height:80px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;}
  .sm-lbl{position:absolute;top:7px;left:12px;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-weight:700;z-index:2;}
  .sm-track{display:flex;flex-direction:column;align-items:center;width:100%;}
  .sm-track.spin{animation:reel .04s linear infinite;}
  @keyframes reel{0%{transform:translateY(0)}100%{transform:translateY(-60px)}}
  .sm-item{min-height:60px;display:flex;align-items:center;justify-content:center;padding:6px 10px;text-align:center;width:100%;flex-shrink:0;}
  .sm-club{font-family:"Bebas Neue",cursive;font-size:21px;letter-spacing:1px;color:white;line-height:1.1;text-align:center;}
  .sm-era{font-family:"Bebas Neue",cursive;font-size:25px;letter-spacing:2px;color:var(--gold);line-height:1;}
  .sm-overlay{position:absolute;inset:0;background:linear-gradient(180deg,var(--card) 0%,transparent 35%,transparent 65%,var(--card) 100%);pointer-events:none;z-index:1;}
  .sm-hint{padding:8px 14px 0;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-weight:600;}
  .sm-btns{padding:8px 14px 12px;display:flex;gap:8px;}
  .btn-rr{flex:1;padding:10px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
  .btn-rr:hover:not(:disabled){border-color:var(--accent2);color:var(--accent2);}
  .btn-rr:disabled{opacity:.3;cursor:not-allowed;}
  .pick-wrap{margin:10px 14px 0;}
  .pick-lbl{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:8px;}
  .pos-filter{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
  .pos-btn{padding:3px 9px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s;}
  .pos-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(37,99,235,.1);}
  .plist{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow-y:auto;max-height:252px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .plist::-webkit-scrollbar{width:4px;}
  .plist::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .pi{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;gap:10px;}
  .pi:last-child{border-bottom:none;}
  .pi:hover{background:rgba(37,99,235,.1);}
  .pi.grey{opacity:.25;cursor:not-allowed;pointer-events:none;}
  .pi-num{font-family:"Bebas Neue",cursive;font-size:15px;color:var(--muted);width:22px;text-align:right;flex-shrink:0;}
  .pi-name{flex:1;font-size:14px;font-weight:600;color:var(--text);}
  .pi-pos{display:flex;gap:3px;flex-shrink:0;}
  .pt{font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);padding:2px 5px;border-radius:3px;}
  .pi-rat{font-family:"Bebas Neue",cursive;font-size:17px;color:var(--muted);width:26px;text-align:right;flex-shrink:0;}
  .pi-rat.hr{color:transparent;background:rgba(255,255,255,.07);border-radius:3px;user-select:none;}
  .pitch-wrap{padding:10px 14px 0;}
  .pitch{position:relative;width:100%;padding-bottom:130%;background:linear-gradient(180deg,var(--pd) 0%,var(--pl) 25%,var(--pd) 50%,var(--pl) 75%,var(--pd) 100%);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.07);box-shadow:0 0 30px rgba(37,99,235,.12),inset 0 0 50px rgba(0,0,0,.3);}
  .pitch::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 17%,var(--pline) 17.5%,transparent 18%),linear-gradient(transparent calc(50% - .5px),var(--pline) 50%,transparent calc(50% + .5px)),radial-gradient(circle at 50% 50%,var(--pline) .6%,transparent .7%);}
  .p-tbox{position:absolute;top:4%;left:23%;width:54%;height:18%;border:1px solid var(--pline);border-top:none;}
  .p-tsix{position:absolute;top:4%;left:34%;width:32%;height:7%;border:1px solid var(--pline);border-top:none;}
  .p-bbox{position:absolute;bottom:4%;left:23%;width:54%;height:18%;border:1px solid var(--pline);border-bottom:none;}
  .p-bsix{position:absolute;bottom:4%;left:34%;width:32%;height:7%;border:1px solid var(--pline);border-bottom:none;}
  .slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;}
  .sc{width:40px;height:40px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-family:"Bebas Neue",cursive;font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.4);transition:all .25s;}
  .slot.filled .sc{border:2px solid var(--accent2);background:rgba(37,99,235,.28);color:white;font-size:8px;letter-spacing:.5px;text-align:center;line-height:1.2;padding:3px;box-shadow:0 0 12px rgba(59,130,246,.5);}
  .sl{font-size:8px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.9);}
  .slot.filled .sl{color:rgba(255,255,255,.55);}
  .bscore{margin:10px 14px 0;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;}
  .bscore-ttl{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:8px;}
  .bscore-row{display:flex;gap:14px;align-items:center;}
  .bss{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);}
  .bss .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
  .bss.on{color:var(--text);}
  .bss.on .dot{background:var(--accent2);}
  .trb{margin:10px 14px 0;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
  .trb-lbl{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:7px;}
  .trb-row{display:flex;align-items:center;gap:10px;}
  .trb-bw{flex:1;background:rgba(255,255,255,.06);border-radius:4px;height:5px;overflow:hidden;}
  .trb-b{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s ease;}
  .trb-v{font-family:"Bebas Neue",cursive;font-size:20px;color:white;}
  .trb-v.hr{color:transparent;background:rgba(255,255,255,.08);border-radius:4px;padding:0 8px;user-select:none;}
  .btn-sim{width:100%;padding:16px;background:linear-gradient(135deg,#065f46,#059669);border:none;border-radius:10px;color:white;font-family:"Bebas Neue",cursive;font-size:20px;letter-spacing:3px;cursor:pointer;transition:all .2s;box-shadow:0 4px 18px rgba(5,150,105,.3);}
  .btn-sim:hover{transform:translateY(-1px);}
  .pp-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:16px;}
  .pp-sheet{background:var(--card);border:1px solid var(--border);border-radius:16px 16px 12px 12px;width:100%;max-width:440px;overflow:hidden;}
  .pp-hdr{padding:14px 18px;border-bottom:1px solid var(--border);background:rgba(37,99,235,.1);position:relative;}
  .pp-title{font-family:"Bebas Neue",cursive;font-size:20px;letter-spacing:2px;}
  .pp-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .pp-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px;}
  .pp-slots{padding:12px 14px;display:flex;flex-direction:column;gap:7px;}
  .pp-slot{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;color:var(--text);width:100%;font-size:13px;font-weight:600;}
  .pp-slot:hover{border-color:var(--accent2);background:rgba(37,99,235,.12);}
  .pp-slot-l{display:flex;align-items:center;gap:10px;}
  .pp-badge{font-family:"Bebas Neue",cursive;font-size:15px;letter-spacing:1px;color:var(--accent2);width:32px;}
  .sim-sec{margin:14px;}
  .sim-hdr{text-align:center;padding:16px 0 8px;}
  .sim-rl{font-family:"Bebas Neue",cursive;font-size:26px;letter-spacing:3px;color:var(--gold);margin-bottom:3px;}
  .sim-vs{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .sim-sb{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;}
  .sim-sr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 14px;gap:10px;}
  .sim-tn{font-size:13px;font-weight:700;}
  .sim-tn.us{text-align:left;color:var(--accent2);}
  .sim-tn.them{text-align:right;color:var(--muted);}
  .sim-sc{font-family:"Bebas Neue",cursive;font-size:48px;letter-spacing:4px;text-align:center;color:white;line-height:1;min-width:100px;}
  .sim-sc.win{color:var(--green);}
  .sim-sc.loss{color:var(--red);}
  .sim-sc.draw{color:var(--gold);}
  .sim-agg{border-top:1px solid var(--border);display:flex;justify-content:center;gap:8px;padding:8px 14px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;align-items:center;}
  .agg-v{color:var(--text);font-family:"Bebas Neue",cursive;font-size:15px;}
  .sim-ev{border-top:1px solid var(--border);max-height:180px;overflow-y:auto;scrollbar-width:thin;}
  .ev{display:flex;align-items:center;padding:7px 14px;border-bottom:1px solid rgba(255,255,255,.04);gap:8px;font-size:12px;}
  .ev-min{font-family:"Bebas Neue",cursive;font-size:13px;color:var(--muted);width:30px;flex-shrink:0;}
  .ev-ico{font-size:13px;flex-shrink:0;}
  .ev-txt{flex:1;color:var(--text);}
  .ev-txt.them{color:var(--muted);}
  .sim-nxt{width:100%;padding:15px;background:linear-gradient(135deg,#1d4ed8,#2563eb);border:none;border-radius:10px;color:white;font-family:"Bebas Neue",cursive;font-size:19px;letter-spacing:3px;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(37,99,235,.35);}
  .sim-nxt:hover{transform:translateY(-1px);}
  .rc{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .rh{padding:9px 14px;background:rgba(37,99,235,.1);border-bottom:1px solid var(--border);font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--accent2);display:flex;justify-content:space-between;align-items:center;}
  .rr{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
  .rt{font-size:12px;font-weight:600;color:var(--muted);}
  .rt.us{color:var(--text);}
  .rs{font-family:"Bebas Neue",cursive;font-size:22px;letter-spacing:2px;color:white;padding:0 10px;}
  .rs.win{color:var(--green);}
  .rs.loss{color:var(--red);}
  .rs.draw{color:var(--gold);}
  .trophy{background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(37,99,235,.15));border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:26px 18px;text-align:center;margin-bottom:10px;}
  .trophy-ico{font-size:50px;margin-bottom:10px;}
  .trophy-ttl{font-family:"Bebas Neue",cursive;font-size:30px;letter-spacing:3px;color:var(--gold);}
  .trophy-sub{font-size:13px;color:var(--muted);margin-top:5px;}
  .btn-reset{width:100%;padding:14px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase;}
  .btn-reset:hover{border-color:var(--accent2);}

  .form-wrap{margin:10px 14px 0;}
  .form-lbl{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:6px;}
  .form-btns{display:flex;flex-wrap:wrap;gap:5px;}
  .form-btn{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .15s;}
  .form-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(245,158,11,.08);}
  .form-btn:disabled{cursor:not-allowed;}
  .kofi-link{display:inline-block;margin-top:8px;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 10px;border:1px solid var(--border);border-radius:20px;transition:all .2s;}
  .kofi-link:hover{color:var(--gold);border-color:var(--gold);}

  .confetti-piece{position:fixed;width:8px;height:8px;top:-10px;opacity:0;animation:confetti-fall linear forwards;z-index:999;pointer-events:none;border-radius:2px;}
  @keyframes confetti-fall{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(100vh) rotate(720deg);}}

  .squad-list-wrap{margin:10px 14px 0;}
  .sq-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);gap:10px;}
  .sq-row:last-child{border-bottom:none;}
  .sq-pos{font-family:"Bebas Neue",cursive;font-size:13px;color:var(--accent2);width:28px;flex-shrink:0;}
  .sq-name{flex:1;font-size:14px;font-weight:600;color:var(--text);}
  .sq-club{font-size:10px;color:var(--muted);flex-shrink:0;text-align:right;max-width:130px;}
  .sq-rat{font-family:"Bebas Neue",cursive;font-size:18px;color:var(--text);width:28px;text-align:right;flex-shrink:0;}
  .hidden{display:none!important;}
  .fadein{animation:fi .25s ease;}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">
<div class="hdr">
  <div class="hdr-stars">&#9733; &#9733; &#9733; &#9733; &#9733;</div>
  <h1>15-0-0-CL</h1>
  <div class="hdr-sub">Champions League XI Builder</div>
  <div class="hdr-ctrl"><div class="tog-wrap">Hide Ratings<label class="tog"><input type="checkbox" id="tog-hide"><span class="tog-sl"></span></label></div></div>
</div>
<div id="phase-build">
  <div class="roll-wrap"><button class="btn-roll" id="btn-roll">ROLL &#127922;</button></div>
  <div class="form-wrap" id="form-wrap">
    <div class="form-lbl">Formation</div>
    <div class="form-btns" id="formation-wrap"></div>
  </div>
  <div class="sm-wrap hidden" id="sm-wrap">
    <div class="sm">
      <div class="sm-reels">
        <div class="sm-reel"><div class="sm-lbl">Club</div><div class="sm-overlay"></div><div class="sm-track" id="sm-ct"><div class="sm-item"><div class="sm-club" id="sm-cv">-</div></div></div></div>
        <div class="sm-reel"><div class="sm-lbl">Era</div><div class="sm-overlay"></div><div class="sm-track" id="sm-et"><div class="sm-item"><div class="sm-era" id="sm-ev">-</div></div></div></div>
      </div>
      <div class="sm-hint">NOT FEELING IT? RE-ROLL &middot; <span id="rr-left">2</span> LEFT</div>
      <div class="sm-btns"><button class="btn-rr" id="btn-rrc" disabled>&#8635; Another Club</button><button class="btn-rr" id="btn-rre" disabled>&#8635; Another Era</button></div>
    </div>
  </div>
  <div class="pick-wrap hidden" id="pick-wrap">
    <div class="pick-lbl">Pick a Player</div>
    <div class="pos-filter" id="pos-filter"></div>
    <div class="plist" id="plist"></div>
  </div>
  <div class="pitch-wrap"><div class="pitch" id="pitch"><div class="p-tbox"></div><div class="p-tsix"></div><div class="p-bbox"></div><div class="p-bsix"></div></div></div>
  <div class="bscore"><div class="bscore-ttl">Squad &middot; <span id="picks-cnt">0</span>/11</div><div class="bscore-row"><div class="bss" id="bs-atk"><div class="dot"></div> Attack</div><div class="bss" id="bs-def"><div class="dot"></div> Defense</div><div class="bss" id="bs-mid"><div class="dot"></div> Midfield</div></div></div>
  <div class="hidden" id="squad-list-wrap">
  <div style="margin:10px 14px 0;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;">
    <div style="padding:8px 14px;font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--border);">Your XI</div>
    <div id="squad-list"></div>
  </div>
</div>
<div id="sim-ready" class="hidden">
    <div class="trb"><div class="trb-lbl">Squad Overall Rating</div><div class="trb-row"><div class="trb-bw"><div class="trb-b" id="trb-bar" style="width:0%"></div></div><div class="trb-v" id="trb-val">-</div></div></div>
    <div class="roll-wrap"><button class="btn-sim" id="btn-sim">&#9917; SIMULATE CHAMPIONS LEAGUE</button></div>
  </div>
</div>
<div id="phase-sim" class="hidden">
  <div class="sim-sec">

// - HELPERS -
function R(a){return a[Math.floor(Math.random()*a.length)];}
function avail(){return SQUADS.filter(function(s){return usedIds.indexOf(s.id)===-1;});}
function emptySlotIds(){var f=picks.map(function(p){return p.slotId;});return SLOTS.filter(function(s){return f.indexOf(s.id)===-1;}).map(function(s){return s.id;});}
function teamR(){if(!picks.length)return 0;return Math.round(picks.reduce(function(a,b){return a+b.player.rating;},0)/picks.length);}
function ge(id){return document.getElementById(id);}
function sh(id){ge(id).classList.remove("hidden");}
function hi(id){ge(id).classList.add("hidden");}

function compatSlotsForPlayer(ppos){
  var ei=emptySlotIds(),res=[];
  ei.forEach(function(sid){
    var slot=SLOTS.filter(function(s){return s.id===sid;})[0];
    if(!slot)return;
    var accepts=SLOT_ACCEPTS[slot.pos]||[slot.pos];
    if(ppos.some(function(pp){return accepts.indexOf(pp)!==-1;})) res.push(sid);
  });
  return res;
}

ge("btn-roll").addEventListener("click",function(){

function spinClub(pool,done){
  var t=ge("sm-ct"),v=ge("sm-cv");
  t.classList.add("spin");
  var clubs=[];pool.forEach(function(s){if(clubs.indexOf(s.club)===-1)clubs.push(s.club);});
  var ticks=0,total=14,lastClub="";
  var iv=setInterval(function(){
    ticks++;lastClub=R(clubs);v.textContent=lastClub;
    if(ticks>=total){
      clearInterval(iv);t.classList.remove("spin");
      done(lastClub);
    }
  },40);
}

function spinEra(clubSquads,done){
  var t=ge("sm-et"),v=ge("sm-ev");
  t.classList.add("spin");
  var ticks=0,total=18;
  var iv=setInterval(function(){
    ticks++;v.textContent=R(clubSquads).era;
    if(ticks>=total){clearInterval(iv);t.classList.remove("spin");done();}
  },40);
}

function spinR(which,pool,done){
  var clubs=[];pool.forEach(function(s){if(clubs.indexOf(s.club)===-1)clubs.push(s.club);});
  var t=ge(which==="c"?"sm-ct":"sm-et"),v=ge(which==="c"?"sm-cv":"sm-ev");
  t.classList.add("spin");
  var ticks=0,total=which==="c"?14:18;
  var iv=setInterval(function(){
    ticks++;v.textContent=which==="c"?R(clubs):R(pool).era;
    if(ticks>=total){clearInterval(iv);t.classList.remove("spin");done();}
  },40);
}

function land(pool){
  var sq=R(pool);curSquad=sq;
  ge("sm-cv").textContent=sq.club;
  ge("sm-ev").textContent=sq.era;
  ge("rr-left").textContent=rerolls;
  ge("btn-rrc").disabled=rerolls<=0;ge("btn-rre").disabled=rerolls<=0;
  spinning=false;
  setTimeout(function(){activeFilt="ALL";sh("pick-wrap");ge("pick-wrap").classList.add("fadein");renderList(sq);},250);
}

ge("btn-rrc").addEventListener("click",function(){
  if(rerolls<=0||spinning)return;rerolls--;
  ge("btn-rrc").disabled=true;ge("btn-rre").disabled=true;hi("pick-wrap");
  // Try same era first, different club
  var sameEra=avail().filter(function(s){return s.club!==curSquad.club&&s.era===curSquad.era;});
  var pool=sameEra.length?sameEra:avail().filter(function(s){return s.club!==curSquad.club;});
  if(!pool.length)pool=avail();
  spinClub(pool,function(chosenClub){
    var clubSquads=pool.filter(function(s){return s.club===chosenClub;});
    if(!clubSquads.length)clubSquads=pool;
    spinEra(clubSquads,function(){land(clubSquads);});
  });
});

ge("btn-rre").addEventListener("click",function(){
  if(rerolls<=0||spinning)return;rerolls--;
  ge("btn-rrc").disabled=true;ge("btn-rre").disabled=true;hi("pick-wrap");
  // Era reroll: keep current club, spin only a new era
  var sc=avail().filter(function(s){return s.club===curSquad.club&&s.era!==curSquad.era;});
  if(sc.length){
    spinEra(sc,function(){land(sc);});
  } else {
    // Club has no other eras - spin a whole new club+era
    var pool=avail().filter(function(s){return s.era!==curSquad.era;});
    if(!pool.length)pool=avail();
    spinClub(pool,function(chosenClub){
      var clubSquads=pool.filter(function(s){return s.club===chosenClub;});
      if(!clubSquads.length)clubSquads=pool;
      spinEra(clubSquads,function(){land(clubSquads);});
    });
  }
});

// - PLAYER LIST -
function renderList(sq){
  if(!sq)return;
  var fe=ge("pos-filter");
  // Filter buttons based on what slots are still empty in this formation
  var emptySlotPosNeeded={};
  emptySlotIds().forEach(function(sid){
    var slot=SLOTS.filter(function(s){return s.id===sid;})[0];
    if(slot)emptySlotPosNeeded[slot.pos]=true;
  });
  // Which player positions can still play?
  var playablePlayerPos={};
  sq.players.forEach(function(p){
    p.pos.forEach(function(pp){
      if(compatSlotsForPlayer([pp]).length>0) playablePlayerPos[pp]=true;
    });
  });
  var allPos=["GK","LB","CB","RB","CM","LM","RM","LW","RW","ST"];
  var fps=["ALL"].concat(allPos.filter(function(p){return playablePlayerPos[p];}));
  fe.innerHTML=fps.map(function(p){return "<button class='pos-btn"+(p==="ALL"?" active":"")+"' data-pos='"+p+"'>"+p+"</button>";}).join("");
  fe.querySelectorAll(".pos-btn").forEach(function(b){
    b.addEventListener("click",function(){
      fe.querySelectorAll(".pos-btn").forEach(function(x){x.classList.remove("active");});
      this.classList.add("active");renderFilteredList(sq,this.getAttribute("data-pos"));
    });
  });
  renderFilteredList(sq,"ALL");
}

function renderFilteredList(sq,filt){
  var le=ge("plist");
  var pl=sq.players;
  if(filt!=="ALL"){
    var cf={LM:["LM","LW"],RM:["RM","RW"],LW:["LW","LM"],RW:["RW","RM"],CM:["CM"]};
    var show=cf[filt]||[filt];
    pl=pl.filter(function(p){return p.pos.some(function(x){return show.indexOf(x)!==-1;});});
  }
  filtPlayers=pl;
  le.innerHTML=pl.map(function(p,i){
    var cs=compatSlotsForPlayer(p.pos);
    var isDupe=usedPlayerNames.indexOf(p.name)!==-1;
    var ok=cs.length>0&&!isDupe;
    var rc=hideR?"pi-rat hr":"pi-rat";
    var tg=p.pos.map(function(x){return "<span class='pt'>"+x+"</span>";}).join("");
    return "<div class='pi"+(ok?"":" grey")+"' data-i='"+i+"'><div class='pi-num'>"+(i+1)+"</div><div class='pi-name'>"+p.name+"</div><div class='pi-pos'>"+tg+"</div><div class='"+rc+"'>"+p.rating+"</div></div>";
  }).join("");
  le.querySelectorAll(".pi:not(.grey)").forEach(function(el){
    el.addEventListener("click",function(){onPick(parseInt(this.getAttribute("data-i"),10));});
  });
}

function onPick(i){
  var p=filtPlayers[i];if(!p)return;
  var cs=compatSlotsForPlayer(p.pos);if(!cs.length)return;
  if(cs.length===1){assign(p,cs[0]);return;}
  openPP(p,cs);
}

// - POSITION PICKER -
function openPP(p,cs){
  ge("pp-name").textContent=p.name;
  ge("pp-info").textContent=curSquad.club+" - "+curSquad.era+(hideR?"":" - Rating "+p.rating);
  var sl=ge("pp-slots");sl.innerHTML="";
  cs.forEach(function(sid){
    var slot=SLOTS.filter(function(s){return s.id===sid;})[0];
    var btn=document.createElement("button");btn.className="pp-slot";
    btn.innerHTML="<div class='pp-slot-l'><div class='pp-badge'>"+slot.pos+"</div><div>"+(SLOT_NAMES_MAP[sid]||slot.pos)+"</div></div><div>&#8594;</div>";
    btn.addEventListener("click",(function(s,pl){return function(){assign(pl,s);closePP();};})(sid,p));
    sl.appendChild(btn);
  });
  sh("pp-ov");
}

ge("pp-close").addEventListener("click",closePP);
ge("pp-ov").addEventListener("click",function(e){if(e.target===this)closePP();});

// - ASSIGN -
function assign(player,slotId){
  picks.push({slotId:slotId,player:player,squad:curSquad});
  usedIds.push(curSquad.id);
  usedPlayerNames.push(player.name);
  hi("sm-wrap");hi("pick-wrap");
  ge("btn-roll").disabled=false;
  ge("picks-cnt").textContent=picks.length;
  // Lock formation buttons once first pick made
  if(picks.length===1){
    var fbtns=document.querySelectorAll(".form-btn");
    fbtns.forEach(function(b){b.disabled=true;b.style.opacity="0.4";});
  }
  renderPitch();updateBS();
  if(picks.length>=11){
    ge("btn-roll").style.display="none";
    sh("sim-ready");ge("sim-ready").classList.add("fadein");
    // Auto show ratings when team is complete
    ge("tog-hide").checked=false;hideR=false;updateBS();showTRB();
    renderSquadList();
  }
  window.scrollTo({top:0,behavior:"smooth"});
}

// - PITCH -
function renderSquadList(){
  var el=ge("squad-list");
  if(!el)return;
  var maxR=picks.length?Math.max.apply(null,picks.map(function(p){return p.player.rating;})):0;
  var ordered=SLOTS.map(function(slot){return picks.filter(function(p){return p.slotId===slot.id;})[0];}).filter(Boolean);
  el.innerHTML=ordered.map(function(p){
    var slot=SLOTS.filter(function(s){return s.id===p.slotId;})[0];
    var isStar=p.player.rating===maxR;
    var pct=Math.round((p.player.rating-65)/(98-65)*100);
    pct=Math.max(0,Math.min(100,pct));
    return "<div class='sq-row'>"
      +"<div class='sq-pos'>"+slot.pos+"</div>"
      +"<div class='sq-name'>"+(isStar?"&#9733; ":"")+p.player.name+"</div>"
      +"<div class='sq-club'>"+p.squad.club+" "+p.squad.era+"</div>"
      +"<div class='sq-rat'>"+p.player.rating+"</div>"
      +"</div>";
  }).join("");
  sh("squad-list-wrap");
}


function renderPitch(){
  var pitch=ge("pitch");
  pitch.querySelectorAll(".slot").forEach(function(el){el.remove();});
  SLOTS.forEach(function(slot){
    var pick=picks.filter(function(p){return p.slotId===slot.id;})[0];
    var el=document.createElement("div");el.className="slot"+(pick?" filled":"");
    el.style.left=slot.x+"%";el.style.top=slot.y+"%";
    if(pick){var pts=pick.player.name.split(" ");var isStar=picks.length>=11&&pick.player.rating===Math.max.apply(null,picks.map(function(x){return x.player.rating;}));var nm=(pts.length>1?pts[pts.length-1]:pts[0]);el.innerHTML="<div class='sc'>"+(isStar?"&#9733; ":"")+nm+"</div><div class='sl'>"+pick.squad.era.slice(2,4)+(isStar?" &#9733;":"")+"</div>";}
    else{el.innerHTML="<div class='sc'>"+slot.pos+"</div><div class='sl'>"+slot.pos+"</div>";}
    pitch.appendChild(el);
  });
}

function updateBS(){
  var atk=picks.filter(function(p){return p.player.pos.some(function(x){return["LW","RW","ST","LM","RM"].indexOf(x)!==-1;});});
  var def=picks.filter(function(p){return p.player.pos.some(function(x){return["GK","LB","CB","RB"].indexOf(x)!==-1;});});
  var mid=picks.filter(function(p){return p.player.pos.some(function(x){return x==="CM";});});
  function avg(a){return a.length?Math.round(a.reduce(function(x,b){return x+b.player.rating;},0)/a.length):null;}
  function upd(id,lbl,arr){var el=ge(id),a=avg(arr);if(arr.length){el.classList.add("on");el.innerHTML="<div class='dot'></div>"+lbl+(a&&!hideR?" <strong style='margin-left:3px'>"+a+"</strong>":"");}else{el.classList.remove("on");el.innerHTML="<div class='dot'></div>"+lbl;}}
  upd("bs-atk","Attack",atk);upd("bs-def","Defense",def);upd("bs-mid","Midfield",mid);

// - MATCH DATA -
function simD(or,opr,oppSquad,isET,redCardUs,redCardThem,isHome){
  // ET is shorter: fewer goals
  var sw=isET?3:6,homeAdj=isHome?2:(isHome===false?-2:0),oE=or+(Math.random()*sw*2-sw)+homeAdj,opE=(opr*0.98)+(Math.random()*sw*2-sw)-homeAdj;
  // Red cards affect strength
  if(redCardUs)oE-=8;if(redCardThem)opE-=8;
  var d=oE-opE;
  var us=0,th=0;
  if(d>10){us=Math.floor(Math.random()*3)+1;th=Math.max(0,us-Math.floor(Math.random()*3));}
  else if(d>3){us=Math.random()>.20?Math.floor(Math.random()*2)+1:0;if(Math.random()>.55)th=Math.max(0,us-1);if(us>=2&&Math.random()>.6)th=Math.min(th+1,us-1);}
  else if(d<-10){th=Math.floor(Math.random()*3)+1;us=Math.max(0,th-Math.floor(Math.random()*3));}
  else if(d<-3){th=Math.random()>.20?Math.floor(Math.random()*2)+1:0;if(Math.random()>.55)us=Math.max(0,th-1);}
  else{if(Math.random()<0.10){us=0;th=0;}else{us=Math.floor(Math.random()*3);th=Math.floor(Math.random()*3);if(us===0&&th===0){if(Math.random()>.5)us=1;else th=1;}}}

  // Outfield scorers
  // Weighted scorer pool: attackers more likely, defenders less
  var ourAtk=[],ourMid=[],ourDef=[];
  picks.forEach(function(p){
    if(p.slotId==="GK")return;
    var nm=p.player.name.split(" ").pop();
    var pos=p.player.pos[0];
    if(["ST","LW","RW","LM","RM"].indexOf(pos)!==-1){ourAtk.push(nm);ourAtk.push(nm);ourAtk.push(nm);}
    else if(pos==="CM"){ourMid.push(nm);ourMid.push(nm);}
    else{ourDef.push(nm);}
  });
  var ourOut=ourAtk.concat(ourMid).concat(ourDef);
  if(!ourOut.length)ourOut=picks.map(function(p){return p.player.name.split(" ").pop();});
  var oppAtk=[],oppMid=[],oppDef2=[];
  if(oppSquad&&oppSquad.players){
    oppSquad.players.forEach(function(p){
      if(p.pos[0]==="GK")return;
      var nm=p.name.split(" ").pop();
      if(["ST","LW","RW","LM","RM"].indexOf(p.pos[0])!==-1){oppAtk.push(nm);oppAtk.push(nm);oppAtk.push(nm);}
      else if(p.pos[0]==="CM"){oppMid.push(nm);oppMid.push(nm);}
      else{oppDef2.push(nm);}
    });
  }
  var oppPool=(oppAtk.concat(oppMid).concat(oppDef2)).length?(oppAtk.concat(oppMid).concat(oppDef2)):SP;

  var um=[],tm=[],evs=[];
  for(var i=0;i<us;i++)um.push(Math.floor(Math.random()*90)+1);
  for(var j=0;j<th;j++)tm.push(Math.floor(Math.random()*90)+1);
  um.sort(function(a,b){return a-b;});tm.sort(function(a,b){return a-b;});

  var all=um.map(function(m){return{m:m,u:true,t:"goal"};}).concat(tm.map(function(m){return{m:m,u:false,t:"goal"};}));
  // 1 drama event: post (85%) or red card (15%)
  var isRed=Math.random()<0.15;
  var forUs=Math.random()>0.5;
  all.push({m:Math.floor(Math.random()*85)+1,u:forUs,t:isRed?"red":"post"});
  all.sort(function(a,b){return a.m-b.m;});

  // Track if red card was issued (affects subsequent play)
  var redUs=false,redThem=false;
  all.forEach(function(e){
    var n=e.u?R(ourOut):R(oppPool);
    if(e.t==="goal")evs.push({m:e.m,i:"Goal",txt:n+" scores!",u:e.u});
    else if(e.t==="red"){evs.push({m:e.m,i:"Red",txt:n+" - RED CARD!",u:e.u});if(e.u)redUs=true;else redThem=true;}
    else evs.push({m:e.m,i:"Post",txt:n+" hits the post!",u:e.u});
  });
  return{us:us,them:th,result:us>th?"win":us<th?"loss":"draw",events:evs,redUs:redUs,redThem:redThem};
}

// - PLAY MATCH -
function playM(game){
  var isHome=game.t==="k2"||game.t==="et"?true:(game.t==="k1"?false:null);
  var md=simD(simSt.or,game.opp.rating,game.opp,game.t==="et"||game.t==="fet",game.redUs,game.redThem,isHome);
  game.result=md;
  var su=0,st=0,ei=0,evs=md.events;
  // For leg2/ET, start from agg display
  if(game.t==="k2"||game.t==="et"){
    su=0;st=0; // show this leg's score
  }
  function step(){
    if(ei>=evs.length){su=md.us;st=md.them;updSc(su,st);setTimeout(function(){resolveM(game);},600);return;}
    var ev=evs[ei++];
    if(ev.i==="Goal"){if(ev.u)su++;else st++;updSc(su,st);}
    if(game.t==="et"||game.t==="fet"){
      // Update agg display live during ET
      var baseUs=game.agg?game.agg.us:0,baseThem=game.agg?game.agg.them:0;
      ge("sim-agg-v").textContent=(baseUs+su)+"-"+(baseThem+st);
    }
    addEv(ev);
    ge("sim-ev").scrollTop=ge("sim-ev").scrollHeight;
    setTimeout(step,ei===evs.length?600:900);
  }
  step();
}

function updSc(u,t){var el=ge("sim-sc");el.textContent=u+" - "+t;el.className="sim-sc "+(u>t?"win":u<t?"loss":"draw");}

function addEv(ev){
  var d=document.createElement("div");d.className="ev";
  var ico=ev.i==="Goal"?"&#9917;":ev.i==="Red"?"&#128997;":"<span style='display:inline-block;width:13px;height:13px;border:2px solid #64748b;border-radius:2px;vertical-align:middle'></span>";
  var cls="ev-txt"+(ev.u===false?" them":"");
  d.innerHTML="<div class='ev-min'>"+ev.m+"'</div><div class='ev-ico'>"+ico+"</div><div class='"+cls+"'>"+ev.txt+"</div>";
  ge("sim-ev").appendChild(d);
}

function setNxt(lbl,fn){var b=ge("sim-nxt");b.textContent=lbl;b.onclick=fn;b.classList.remove("hidden");}

// - PENALTIES -
function showPenalties(game){
  ge("sim-rl").textContent=game.t==="fpens"?"FINAL - Penalty Shootout":"Penalty Shootout";
  ge("sim-vs").textContent="vs "+game.opp.club;
  ge("sim-opp").textContent=game.opp.club+" '"+game.opp.era.slice(2,4);
  ge("sim-sc").style.display="";
  ge("sim-sc").textContent="0 - 0";
  ge("sim-sc").className="sim-sc draw";
  hi("sim-agg");
  ge("sim-ev").innerHTML="";
  ge("sim-nxt").classList.add("hidden");

  var ourTakers=picks.filter(function(p){return p.slotId!=="GK";}).map(function(p){return p.player.name.split(" ").pop();});
  var oppTakers=[];
  if(game.opp&&game.opp.players){oppTakers=game.opp.players.filter(function(p){return p.pos[0]!=="GK";}).map(function(p){return p.name.split(" ").pop();});}
  if(!oppTakers.length)oppTakers=SP;

  // Simulate 5 pens each, then sudden death if tied
  var ourPens=0,oppPens=0,round=0,evs=[],maxRounds=8;
  var ourAdv=simSt.or>=(game.opp.rating||80)?0.05:0;

  function takePen(round){
    var ourScore=Math.random()<(0.80+ourAdv);
    var oppScore=Math.random()<0.70;
    var ourN=R(ourTakers),oppN=R(oppTakers);
    if(ourScore)ourPens++;else;
    if(oppScore)oppPens++;else;
    evs.push({us:ourScore,oppScore:oppScore,ourN:ourN,oppN:oppN,round:round,ourTotal:ourPens,oppTotal:oppPens});
    return{ourScore:ourScore,oppScore:oppScore};
  }

  // Pre-simulate all pens
  var penEvs=[];
  for(var r=0;r<5;r++){
    var pOur=Math.random()<(0.80+ourAdv);
    var pOpp=Math.random()<0.70;
    penEvs.push({r:r,pOur:pOur,pOpp:pOpp,ourN:R(ourTakers),oppN:R(oppTakers)});
  }
  // Check if tied after 5, add sudden death
  var s1=0,s2=0;
  penEvs.forEach(function(e){if(e.pOur)s1++;if(e.pOpp)s2++;});
  var sdEvs=[];
  if(s1===s2){
    for(var sd=0;sd<6;sd++){
      var sdOur=Math.random()<(0.75+ourAdv),sdOpp=Math.random()<0.73;
      sdEvs.push({r:5+sd,pOur:sdOur,pOpp:sdOpp,ourN:R(ourTakers),oppN:R(oppTakers),sd:true});
      if(sdOur!==sdOpp)break; // decisive round
    }
  }
  var allPens=penEvs.concat(sdEvs);

  // Play them out with delays
  var su=0,so=0,pi=0;
  function nextPen(){
    if(pi>=allPens.length){
      // Done
      var won=su>so;
      updSc(su,so);
      var penNote=" (Pens)";
      simSt.res.push({t:game.t==="fpens"?"fr":"agg",won:won,agg:game.agg,pen:penNote,rd:game.rd||"Final",opp:game.opp,md:{us:game.agg?game.agg.us:0,them:game.agg?game.agg.them:0}});
      if(!won){simSt.out=true;simSt.outAt=game.rd||"Final";}
      if(game.t==="fpens"){simSt.res[simSt.res.length-1].t="fr";simSt.res[simSt.res.length-1].won=won;}
      setTimeout(function(){setNxt(won?"NEXT ROUND":"SEE RESULTS",won?nxtGame:showRes);},500);
      return;
    }
    var pe=allPens[pi++];
    if(pe.pOur)su++;if(pe.pOpp)so++;
    // Show our pen
    var ourD=document.createElement("div");ourD.className="ev";
    var ourIco=pe.pOur?"&#9917;":"&#10060;";
    ourD.innerHTML="<div class='ev-min'>"+(pe.r+1)+"</div><div class='ev-ico'>"+ourIco+"</div><div class='ev-txt'>"+pe.ourN+(pe.pOur?" scores":" misses")+(pe.sd?" (SD)":"")+"</div>";
    ge("sim-ev").appendChild(ourD);
    setTimeout(function(e){return function(){
      var oppD=document.createElement("div");oppD.className="ev";
      var oppIco=e.pOpp?"&#10060;":"&#9917;"; // crosses = their goal (bad for us)
      oppD.innerHTML="<div class='ev-min'>"+(e.r+1)+"</div><div class='ev-ico'>"+(e.pOpp?"&#9917;":"&#10060;")+"</div><div class='ev-txt them'>"+e.oppN+(e.pOpp?" scores":" misses")+(e.sd?" (SD)":"")+"</div>";
      ge("sim-ev").appendChild(oppD);
      ge("sim-ev").scrollTop=ge("sim-ev").scrollHeight;
      updSc(su,so);
      setTimeout(nextPen,700);
    };}(pe),700);
  }
  nextPen();
}

// - RESOLVE MATCH -
function resolveM(game){
  var res=game.result;

  // Track stats
  if(game.t==="g"||game.t==="k1"||game.t==="k2"||game.t==="f"||game.t==="et"||game.t==="fet"){
    simSt.gf+=res.us;simSt.ga+=res.them;
    if(res.them===0)simSt.cs++;
    if(res.result==="win")simSt.w++;else if(res.result==="draw")simSt.d++;else simSt.l++;
  }

  if(game.t==="g"){
    if(res.result==="win")simSt.gp+=3;else if(res.result==="draw")simSt.gp+=1;
    simSt.groupGames.push(game);
    var done=simSt.groupGames.length;
    if(done>=8){
      var rows=buildGroupTable(simSt.groupGames);
      showGroupStandings(rows,simSt.gp,function(){
        var q=simSt.gp>=12; // raise bar: need 12pts (4 wins) to auto-qualify, 9-11 = playoff zone, <9 = out
        // Actually use position: top 8 qualify
        var ourRow=rows.filter(function(r){return r.us;})[0];
        var ourPos=rows.indexOf(ourRow);
        if(ourPos>=8){simSt.out=true;simSt.outAt="League Phase";showRes();}
        else{
          ["Round of 16","Quarter-Final","Semi-Final"].forEach(function(r){simSt.q.push({t:"k1",rd:r,opp:getOpp()});});
          simSt.q.push({t:"f",opp:getOpp()});
          nxtGame();
        }
      });
    }else{setNxt("NEXT GAME",nxtGame);}

  }else if(game.t==="k1"){
    simSt.res.push(game);
    simSt.q.unshift({t:"k2",rd:game.rd,opp:game.opp,l1:res,redUs:res.redUs,redThem:res.redThem});
    sh("sim-agg");ge("sim-agg-v").textContent=res.us+"-"+res.them;
    setNxt("LEG 2",nxtGame);

  }else if(game.t==="k2"){
    var agg={us:game.l1.us+res.us,them:game.l1.them+res.them};
    ge("sim-agg-v").textContent=agg.us+"-"+agg.them;
    if(agg.us>agg.them){
      simSt.res.push({t:"agg",agg:agg,thru:true,rd:game.rd,opp:game.opp,pen:""});
      setNxt("NEXT ROUND",nxtGame);
    }else if(agg.us<agg.them){
      simSt.res.push({t:"agg",agg:agg,thru:false,rd:game.rd,opp:game.opp,pen:""});
      simSt.out=true;simSt.outAt=game.rd;setNxt("SEE RESULTS",showRes);
    }else{
      // Level on agg - play ET
      simSt.q.unshift({t:"et",rd:game.rd,opp:game.opp,agg:agg,redUs:res.redUs,redThem:res.redThem});
      setNxt("EXTRA TIME",nxtGame);
    }

  }else if(game.t==="et"){
    var newAgg={us:game.agg.us+res.us,them:game.agg.them+res.them};
    ge("sim-agg-v").textContent=newAgg.us+"-"+newAgg.them;
    if(newAgg.us>newAgg.them){
      simSt.res.push({t:"agg",agg:newAgg,thru:true,rd:game.rd,opp:game.opp,pen:" (AET)"});
      setNxt("NEXT ROUND",nxtGame);
    }else if(newAgg.us<newAgg.them){
      simSt.res.push({t:"agg",agg:newAgg,thru:false,rd:game.rd,opp:game.opp,pen:" (AET)"});
      simSt.out=true;simSt.outAt=game.rd;setNxt("SEE RESULTS",showRes);
    }else{
      simSt.q.unshift({t:"pens",rd:game.rd,opp:game.opp,agg:newAgg});
      setNxt("PENALTIES",nxtGame);
    }

  }else if(game.t==="f"){
    if(res.result==="win"){
      simSt.res.push({t:"fr",won:true,pen:"",opp:game.opp,md:res});
      setNxt("SEE RESULTS",showRes);
    }else if(res.result==="loss"){
      simSt.res.push({t:"fr",won:false,pen:"",opp:game.opp,md:res});
      simSt.out=true;simSt.outAt="Final";setNxt("SEE RESULTS",showRes);
    }else{
      // Draw in final - go to ET
      simSt.q.unshift({t:"fet",rd:"Final",opp:game.opp,agg:{us:res.us,them:res.them},redUs:res.redUs,redThem:res.redThem});
      setNxt("EXTRA TIME",nxtGame);
    }

  }else if(game.t==="fet"){
    var fAgg={us:game.agg.us+res.us,them:game.agg.them+res.them};
    if(fAgg.us!==fAgg.them){
      var fWon=fAgg.us>fAgg.them;
      simSt.res.push({t:"fr",won:fWon,pen:" (AET)",opp:game.opp,md:{us:fAgg.us,them:fAgg.them}});
      if(!fWon){simSt.out=true;simSt.outAt="Final";}
      setNxt("SEE RESULTS",showRes);
    }else{
      simSt.q.unshift({t:"fpens",rd:"Final",opp:game.opp,agg:fAgg});
      setNxt("PENALTIES",nxtGame);
    }
  }
}

// - GROUP TABLE -
function buildGroupTable(ourGames){
  // 36-team format: simulate 35 other teams
  var rows=[{name:"Your XI",us:true,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}];
  var oppNames=simSt.groupOpps.map(function(o){return o.club+" '"+o.era.slice(2,4);});
  // Add 27 more simulated teams to reach 36
  var extraTeams=[];
  var extraPool=SQUADS.filter(function(s){return usedIds.indexOf(s.id)===-1;});
  for(var e=0;e<27;e++){
    var sq=extraPool.length?extraPool[Math.floor(Math.random()*extraPool.length)]:R(SQUADS);
    extraTeams.push(sq.club+" '"+sq.era.slice(2,4));
  }
  var allOtherNames=oppNames.concat(extraTeams);
  allOtherNames.forEach(function(n){rows.push({name:n,us:false,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});});

  // Fill our row from real games
  ourGames.forEach(function(g){
    var r=g.result;rows[0].p++;rows[0].gf+=r.us;rows[0].ga+=r.them;
    if(r.result==="win"){rows[0].w++;rows[0].pts+=3;}
    else if(r.result==="draw"){rows[0].d++;rows[0].pts+=1;}
    else rows[0].l++;
  });

  // Simulate all other teams (each plays 8 games vs random opponents)
  for(var i=1;i<rows.length;i++){
    var p=0,w=0,d=0,l=0,gf=0,ga=0,pts=0;
    for(var g2=0;g2<8;g2++){
      var gf2=Math.floor(Math.random()*3),ga2=Math.floor(Math.random()*3);
      p++;gf+=gf2;ga+=ga2;
      if(gf2>ga2){w++;pts+=3;}else if(gf2<ga2){l++;}else{d++;pts+=1;}
    }
    rows[i].p=p;rows[i].w=w;rows[i].d=d;rows[i].l=l;rows[i].gf=gf;rows[i].ga=ga;rows[i].pts=pts;
  }

  rows.sort(function(a,b){if(b.pts!==a.pts)return b.pts-a.pts;return(b.gf-b.ga)-(a.gf-a.ga);});
  return rows;
}

  showRows.forEach(function(r,i){

  });
  html+="<div style='padding:6px 14px;font-size:9px;color:var(--muted);letter-spacing:1px'>TOP 8 QUALIFY FOR KNOCKOUTS</div></div>";

}

function ordinal(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

// - RESULTS -

function genSummary(or,won,outAt,gf,ga,cs,w,d,l,gp,starPick){
  var lines=[];
  var total=w+d+l;
  var gd=gf-ga;
  var starName=starPick?starPick.player.name.split(" ").pop():"";

  // Opening line - what happened
  if(won){
    if(or>=90) lines.push("Exactly what was expected from a squad of this quality. The Champions League is won.");
    else if(or>=86) lines.push("Overachieved on paper, but nobody told this XI that. Champions of Europe.");
    else lines.push("Against all expectations, they went all the way. Remarkable.");
  } else if(outAt==="League Phase"){
    if(gp>=9) lines.push("Qualified from the group but the draw was unkind after that. Gone before the knockouts mattered.");
    else if(or>=86) lines.push("A squad rated "+or+" and out in the groups. The numbers don't add up.");
    else lines.push("The group stage was a wall they couldn't scale. Eliminated early.");
  } else if(outAt==="Round of 16"){
    lines.push("Made it through the groups, then ran into a side they couldn't handle in the last 16.");
  } else if(outAt==="Quarter-Final"){
    lines.push("A decent run. Quarter-finals is respectable. Just couldn't find another gear when it mattered.");
  } else if(outAt==="Semi-Final"){
    lines.push("So close. A semi-final exit is no disgrace, but it'll sting for a while.");
  } else if(outAt==="Final"){
    lines.push("They reached the final. That counts for something, even if the winners' medal never came.");
  }

  // Record line
  var gdStr=(gd>0?"+":"")+gd;
  lines.push(w+"W "+d+"D "+l+"L across "+total+" games. "+gf+" scored, "+ga+" conceded (GD "+gdStr+"). "+cs+" clean sheet"+(cs===1?"":"s")+".");

  // Flavour line based on stats
  if(gf>ga*2&&gf>=10) lines.push("Attacking football throughout - this side came to play.");
  else if(ga>gf&&!won) lines.push("Conceding more than they scored tells its own story.");
  else if(cs>=5) lines.push("Defensively solid. The back line earned their wages.");
  else if(d>=4) lines.push("Too many draws. A clinical edge was missing.");
  else if(l===0&&!won) lines.push("Unbeaten but still didn't go all the way. Football is cruel.");

  // Star player line
  if(starPick&&!won){
    lines.push(starName+" ("+starPick.player.rating+") was the standout. Deserved a better stage.");
  } else if(starPick&&won){
    lines.push(starName+" led from the front. "+starPick.player.rating+" rated and worth every point.");
  }

  return lines;
}

function launchConfetti(){
  var colors=["#f5c518","#2563eb","#22c55e","#ef4444","#f59e0b","#fff","#93c5fd"];
  for(var i=0;i<80;i++){
    (function(i){
      setTimeout(function(){
        var el=document.createElement("div");
        el.className="confetti-piece";
        el.style.left=Math.random()*100+"vw";
        el.style.background=colors[Math.floor(Math.random()*colors.length)];
        el.style.width=(6+Math.random()*8)+"px";
        el.style.height=(6+Math.random()*8)+"px";
        el.style.animationDuration=(1.5+Math.random()*2)+"s";
        el.style.animationDelay="0s";
        document.body.appendChild(el);
        setTimeout(function(){el.remove();},4000);
      },i*30);
    })(i);
  }
}
